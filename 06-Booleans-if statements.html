<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Boolean</title>
  </head>
  <body>
    <script>
      console.log(3 > 5); // Bollean show if value is true or false
      console.log(typeof true);
      console.log(5 == "5.00"); // 5 is not equal to string '5' but == equal them

      if (true) {
        // if the value of () is true then console.log will be RUN. if false then code not RUN.
        console.log("hello");
      }
      if (false) {
        //if false then code not RUN.
        console.log("Bye");
      } else {
        console.log("else");
      }

      const age = 15;
      if (age >= 18) {
        console.log("You can Drive");
      } else if (age >= 14) {
        console.log("Almost there");
      } else {
        console.log("You can not Drive");
      }

      // AND operator &&

      console.log(true && true);
      const message = 5 && 'hello';
      console.log(message);
      
      // OR operator ||

      console.log(true || false);
      const currency = undefined || 'USD'; // if the first value is falsy then it will return the second value. if the first value is truthy then it will return the first value.
      console.log(currency);
      

      
      // NOT operator ! 

      console.log(!true);

      
      
      
    </script>
  </body>
</html>
