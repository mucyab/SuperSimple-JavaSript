<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document Object Model</title>
  </head>
  <body>
    <button>Hello</button>

    <script>
      console.log(document.title);
      document.title = "DOM"; // here DOM change the title of HTML body,

      console.log(document.body); // DOM combine HTML and JavaScript together and give full control to JavaScrip.
      console.log(typeof document.body); // = object

      console.log(document.body.innerHTML);

      // document.body.innerHTML = 'hello'; // DOM is built-in JavaScript Object. in this line DOM change the button to plain Text. it change the HTML original element.

      document.body.innerHTML = "<button>Tari Behn di Siri</button>";

      document.querySelector("button"); 
      console.log(document.querySelector("button"));


      //syntax Rule. it contain properites as body, title that can be access by document. DOM is directly link to the Webpage.
      // it also have methods too
    </script>
  </body>
</html>
