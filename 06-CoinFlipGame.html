<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            text-align: center;
            margin-top: 50px;
            background-color: #f4f4f9;
        }
        button {
            font-size: 18px;
            padding: 10px 20px;
            margin: 10px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            background-color: #007bff;
            color: white;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #0056b3;
        }
        #game-display {
            margin-top: 30px;
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h2>Coin Flip Game</h2>
    <p>Click a Button to make Your Guess</p>
    <button onclick="playGame('heads')"> Guess the Heads</button>
    <button onclick="playGame('tails')"> Guess the Tails</button>
    <div id="game-display"></div>
    <script>
        function playGame(guess){
            const randomNumner = Math.random();

            const result = randomNumner <0.5? 'heads' : 'tails';

            const outcome = guess === result ? 'You Win' : 'You lose';

            console.log(`---New Flip---`);
            console.log(`RandomNumer: ${randomNumner}`);
            console.log(`Your Guess: ${guess}`);
            console.log(`Result: ${result}`);
            console.log(outcome);

            document.getElementById('game-display').innerHTML= `
            <P>The Coin Landed on : <strong>${result}</storng></p>
                <p style="color: ${guess === result ? 'green' : 'red'};">${outcome}</p>
                `;
            
        }
    </script>
</body>
</html>
