<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Obejects in JavaScript</title>
</head>
<body>
    <script> // Why Object is need. beacuase Object is used to make our code more organized and simple, instead of creating alot of variables, we can   just simple grounp them together. and it also used to call multiple values at ones

        const product = { //object start by { and end by }
            name: 'socks', // these are Propery-Value pair, seprate by , 
            price: 1090
        };
        console.log(product); // call the object
        console.log(typeof product); // if we want to check Type of.
        console.log(product.name); // call the signle Propert-Value Pair.
        console.log(product.price);

        product.name = 'cotton socks'; // Change the Value of Propert already assigned
        console.log(product);

        product.newProperty = true; //Add new property
        console.log(product);

        delete product.newProperty; // delete any property in the Object
        console.log(product);
        
        const product1 = {
            name: 'Shirt',
            ['delivery-time']: '1 day',
            rating: {               // nested object, object inside the object
                stars: 4.5,
                count: 87
            },

            //adding function in an object
            fun: function f1 () {
                console.log('function inside the object');
                
            }
        };
        console.log(product1);
        console.log(product1.name); //Dot. Notation
        console.log(product1['name']); //same as Dot-Notation. its Brackets Notation, and we access by value in string variable
       // console.log(product1.delivery-time); // JavaScript take - as Math, and give error, so we use [], 
        console.log(product1['delivery-time']);

        console.log(product1.rating);
        console.log(product1.rating.count);
        console.log(product1.fun); // call the function in the object, it will give the function code
        product1.fun(); // call the function in the object, as function was assigned 
        
        // function inside the object is Method, as "console" is a object provided by JavaScript, and "log" is function. it execute what is inside ().
        console.log(typeof console.log); // show the Type of console.log = function.

        // Math.random is also Method, "Math" is object and "random" is function
        
        // "JSON" JavaScript object Notation, it is similer to JavaScript Object but with less feature, heavily use of "" in Value and Properties both, does't support function as object does support.

        // why we use JSON instead of Obeject, as JSON is Universal, it supported by all languages and JavaScript Object only work in JavaScript. we use jSON to send data to other computer/systems which does not support JavaScript. and it also support data store in local Drive.

        JSON.stringify(product1) // convert javaScript Object into JSON.
        console.log(JSON.stringify(product1));  // converted object to string
        console.log(typeof JSON.stringify(product1));
        
        const jsonString = JSON.stringify(product1);
        console.log(JSON.parse(jsonString));  //convert JSON into JavaScript Object
        
        
        
    </script>
</body>
</html>
