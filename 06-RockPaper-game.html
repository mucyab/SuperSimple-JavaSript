<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ROCK, PAPER, SCISSOR</title>
  </head>
  <body>
    <p>Rock Paper Scissors</p>
    <button
      onclick="
        const randomNumber = Math.random();
        let computerMove = '';
        if (randomNumber >= 0 && randomNumber <= 1 / 3) {
          computerMove = 'ROCK';
        } else if (randomNumber >= 1 / 3 && randomNumber < 2 / 3) {
          computerMove = 'PAPER';
        } else if (randomNumber >= 2 / 3 && randomNumber < 1) {
          computerMove = 'SCISSOR';
        }

        let result = '';
        if (computerMove === 'ROCK') {
          result = 'Tie.';
        } else if (computerMove === 'PAPER') {
          result = 'LOSER';
        } else if (computerMove === 'SCISSOR') {
          result = 'Dang, Human Win';
        }

        alert(`You Pick ROCK. Computer Picked ${computerMove}. ${result}`);
      "
    >
      ROCK
    </button>

    <button
      onclick="

          computerMove = 'PAPER';

          result = 'HAHA LOSER';

          result = 'Dang you Win';

          result = 'Equal Mind';

        alert(`You Pick SCISSOR. Computer Picked ${computerMove}. ${result}`);
      ">SCISSOR</button>
