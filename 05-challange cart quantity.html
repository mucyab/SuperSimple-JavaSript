<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cart Quantity</title>
  </head>
  <body>
    <button onclick="console.log(`Cart Quantity: ${CartQuantity}`)">
      Show Quantity
    </button>
    <button
      onclick="
        CartQuantity ++; // add One item only
        console.log(`Cart Quantity: ${CartQuantity}`);
      "
    >
      Add to Cart
    </button>
    <button
      onclick="
        CartQuantity += 2;
        console.log(`Cart Quantity: ${CartQuantity}`);
      "
    >
      +2
    </button>
    <button
      onclick="
        CartQuantity += 3;
        console.log(`Cart Quantity: ${CartQuantity}`);
      "
    >
      +3
    </button>
    <button
      onclick="
        CartQuantity = 0;
        console.log('Cart Was Reset');
        console.log(`Cart Quantity: ${CartQuantity}`);
      "
    >
      Reset the Cart
    </button>

    <script>
      let CartQuantity = 0;
    </script>
  </body>
</html>
