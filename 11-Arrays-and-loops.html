<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arrays and Loops</title>
</head>
<body>
    <script>
        const myArray = [10, 20, 30];
        console.log(myArray);
    
        console.log(myArray[1]); //Display the Value from Array

        myArray[1] = 99; // Change the Already stored value in Array
        console.log(myArray[1]);

        [1, 'hello', true, {name: 'socks'} [1, 2] ] // Storing Different Values in Arrays

        console.log(typeof [1, 2]); // Array is Object in JavaScript and its special type.

        console.log(Array.isArray([1, 2]));

        console.log(myArray.length); // to know how many values in Array

        myArray.push(100)

        console.log(myArray);
        
        myArray.splice(0, 1); // remove a value, 1st value is index position and after , value means how many values you want to remove after index position 
        
        console.log(myArray);

        // While Loop
        let i = 1;  //Loop Variables

        while (i <= 5) {  // Loop Body &. (inside bracket is condition otherwise it become infinite loop)
            console.log(i);
            i = i + 1;  // increment step to control loop.
         // i += 1;
         // i++ ;
         // shortcut for adding 1 increment   
        }


        // For Loop
        //for loop is short mathod of while loop, same but with less lines, Standard loop is = For Loop.
        for (let i = 5; i <= 10; i++) {
            console.log(i);
            
        }

        let randomNumber  = 0;

        while (randomNumber < 0.5) {
            randomNumber = Math.random();
        }
        
        console.log(randomNumber);
        

        //Looping throw an Array

        const todoList = [
            'make dinner',
            'mash dishies',
            'watch youtube'
        ];
        
        for (let index = 0; index < todoList.length; index++) {
            const value = todoList[index];
            console.log(value);
            }
        
        // calculation of arrays numbers    
        const nums = [1,1,3];
        let total = 0;
        
        for (let i = 0; i < nums.length; i ++) {
            const num = nums[i];
            total += num;
            
        }
        console.log(total);
        // dounbled the arrays value
        const numsDoubled = [];

        for ( let i = 0; i < nums.length; i++) {
            const num = nums [i];
            numsDoubled.push(num * 2 );

        }
        console.log(numsDoubled);

        const array1 = [1, 2, 3];
        const array2 = array1.slice(); // .slice create another copy of array1 and add value to 2nd copy
        array2.push(4);
        console.log(array1);
        console.log(array2);

        const [firstValue, secondValue, thirdValue] = [1, 2, 3]; //shortcut of destruction of value

        //Loops have two features thats called 1. breaks and 2. continue
        //1. break means exist a loop early

        for ( i = 1; i <= 10; i++){
            if (i === 3){
                continue;  //this will continue the loop but skip that value, means it skip 3.
            }
            console.log(i);
            if (i === 8 ){
                break;   // this is break feature of loop, let loop stop at early at value 8.
            }
        }
    
        

        

    </script>
</body>
</html>
