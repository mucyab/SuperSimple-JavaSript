<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DOM Project</title>
  </head>
  <body>
    <p>YouTube Subscribe Button</p>
    <button onclick="Subscribe" class="js-subscribe-button">Subscribe</button>

    <p>Amazon Shipping Calculator</p>
    <input placeholder="Cost of the Order" class="js-cost-input">
    <button onclick="
      calculateTotal()
    ">Calculate</button>
    <p class="js-total-cost"></p> 

    <script>
      function calculateTotal() {
        document.querySelector('.js-cost-input')
        const inputElement = document.querySelector('.js-cost-input');
        let cost = inputElement.value;

        if (cost < 40) {
          cost = cost + 10;
        } 
        
          document.querySelector('.js-total-cost')
          .innerHTML = `${cost}`
      }

      function Subscribe() {
        const buttonElement = document.querySelector(".js-subscribe-button");

        if (buttonElement.innerText === "Subscribe") {
          buttonElement.innerHTML = "Subscribed";
        } else {
          buttonElement.innerHTML = "Subscribe";
        }
      }
    </script>
  </body>
</html>
