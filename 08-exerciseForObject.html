<body>
    <script>
        const amazon = {
            product: "Basketball",
            price: 2096
        }
        amazon["Delivery-Time"] = "3 Days"

        console.log(amazon);
        
        amazon.price += 500

        console.log(amazon);
        
        const p1 = {
            name: "Shirt",
            price: 500
        }
        const p2 = {
            name: "Pant",
            price: 300
        }

        function comparePrice(p1, p2) {
            if (p1.price < p2.price) {
                return  p1
            } else {
                return p2
            }
        }

        console.log(comparePrice(p1, p2));
        

    </script>
