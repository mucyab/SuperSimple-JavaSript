    <script>
      function minMax(nums) {
          if (nums.length === 0) {
            return { min: null, max: null };
          }
        let min = nums[0];
        let max = nums[0];
        for (let i = 0; i < nums.length; i++) {
          if (nums[i] < min) {
            min = nums[i];
          }
          if (nums[i] > max) {
            max = nums[i];
          }
        }
        return { min, max };
      }
      console.log(minMax([1, -3, 5]));
      console.log(minMax([-2, 3, -5, 7, 10]));
      console.log(minMax([]));
      console.log(minMax([5]));

        function countWords(words) {
        const result = {};
        for (let i = 0; i < words.length; i++) {
            const word = words[i];
            if (result[word] === undefined) {
                result[word] = 1;
            } else {
                result[word]++; 
            }
        }
        return result; 
      }
      console.log(countWords(['apple', 'grapse', 'apple', 'apple', 'grapse', 'mango']));
      

    </script>
  </body>
