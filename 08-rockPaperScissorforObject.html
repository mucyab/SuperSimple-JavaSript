<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ROCK, PAPER, SCISSOR</title>
  </head>
  <body>
    <p>Rock Paper Scissors</p>

    <button onclick="playGame('ROCK')">ROCK</button>
    <button onclick="playGame('PAPER')">PAPER</button>
    <button onclick="playGame('SCISSOR')">SCISSOR</button>
    <button
      onclick="
        score.win = 0;
        score.losses = 0;
        score.ties = 0;
        localStorage.removeItem('score');
    "
    >
      Reset Score
    </button>

    <script>
      // put score outside so, it change from last time game play, if score put inside the function it will change everytime.
      let score = JSON.parse(localStorage.getItem('score')) || {
          win: 0,
          losses: 0,
          ties: 0
        }; //store our score permanently in local storage instead of everytime refresh.

        /*
      if (!score) {
        score = {
          wins: 0,
          losses: 0,
          ties: 0
        };
      } */

      // 1. This function handles the computer's random choice
      function pickComputerMove() {
        const randomNumber = Math.random();

        if (randomNumber >= 0 && randomNumber < 1 / 3) {
          return "ROCK";
        } else if (randomNumber >= 1 / 3 && randomNumber < 2 / 3) {
          return "PAPER";
        } else {
          return "SCISSOR";
        }
      }

      // 2. This function plays the game using your move and the computer's move
      function playGame(playerMove) {
        const computerMove = pickComputerMove();
        let result = "";

        // Logic for ROCK
        if (playerMove === "ROCK") {
          if (computerMove === "ROCK") {
            result = "Tie.";
          } else if (computerMove === "PAPER") {
            result = "You Lose";
          } else if (computerMove === "SCISSOR") {
            result = "You Win";
          }
        }

        // Logic for PAPER
        else if (playerMove === "PAPER") {
          if (computerMove === "ROCK") {
            result = "You Win";
          } else if (computerMove === "PAPER") {
            result = "Tie";
          } else if (computerMove === "SCISSOR") {
            result = "You Lose";
          }
        }

        // Logic for SCISSOR
        else if (playerMove === "SCISSOR") {
          if (computerMove === "ROCK") {
            result = "You Lose";
          } else if (computerMove === "PAPER") {
            result = "You Win";
          } else if (computerMove === "SCISSOR") {
            result = "Tie";
          }
        }

        if (result === "You Win") {
          score.win += 1;
        } else if (result === "You Lose") {
          score.losses += 1;
        } else if (result === "Tie") {
          score.ties += 1;
        }

        localStorage.setItem('score', JSON.stringify(score));

        // Display the results
        alert(`You Picked ${playerMove}. Computer Picked ${computerMove}. ${result}
        wins: ${score.win}, Losses: ${score.losses}, Ties: ${score.ties}`);
      }
    </script>
  </body>
</html>
